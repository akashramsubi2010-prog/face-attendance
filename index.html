<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Face Attendance</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #video {
      width: 90%;
      max-width: 640px;
      border-radius: 12px;
      border: 3px solid white;
    }

    #status {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Smart Face Recognition Attendance</h1>

  <video id="video" autoplay muted playsinline></video>

  <div id="status">Loading face recognition...</div>

  <button onclick="startCamera()">Start Camera</button>

<script>

const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";

let labeledFaceDescriptors = [];

// -------------------------------
// LOAD FACE-API MODELS
// -------------------------------

async function loadModels() {

  document.getElementById("status").innerText =
    "Loading face recognition models...";

  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

  document.getElementById("status").innerText =
    "Models loaded. Start camera.";

  console.log("Models loaded");
}


// -------------------------------
// START CAMERA
// -------------------------------

async function startCamera() {

  const video = document.getElementById("video");

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });

    video.srcObject = stream;

    document.getElementById("status").innerText =
      "Camera started. Looking for face...";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "Camera permission denied.";
  }
}


// -------------------------------
// FACE RECOGNITION
// -------------------------------

video.addEventListener("play", async () => {

  const canvas = faceapi.createCanvasFromMedia(video);

  document.body.append(canvas);

  const displaySize = {
    width: video.videoWidth,
    height: video.videoHeight
  };

  faceapi.matchDimensions(canvas, displaySize);

  setInterval(async () => {

    const detections =
      await faceapi
        .detectAllFaces(
          video,
          new faceapi.TinyFaceDetectorOptions()
        )
        .withFaceLandmarks()
        .withFaceDescriptors();

    const resizedDetections =
      faceapi.resizeResults(detections, displaySize);

    canvas
      .getContext("2d")
      .clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

    // -------------------------------
    // FACE FOUND
    // -------------------------------

    if (resizedDetections.length > 0) {

      document.getElementById("status").innerText =
        "Face detected!";
      
      console.log("Face detected");

    } else {

      document.getElementById("status").innerText =
        "Looking for face...";
    }

  }, 1000);

});


// -------------------------------
// INITIALIZE
// -------------------------------

loadModels();

</script>

</body>
</html>
